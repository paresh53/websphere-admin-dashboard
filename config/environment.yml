# ============================================================
#  WebSphere Admin Dashboard - Environment Configuration
#  Edit ONLY this file to configure your environment.
#  NEVER put passwords here – use environment variables instead.
# ============================================================

app:
  name: "WebSphere Admin Dashboard"
  title: "IBM Middleware Administration"
  refresh_interval: 30          # Auto-refresh every N seconds
  backend_port: 8000             # FastAPI backend port
  simulation_mode: true          # true = return fake data (no real SSH/WinRM)

  # Optional basic-auth for the dashboard
  auth_enabled: false
  auth_username: "admin"
  auth_password_env: "DASHBOARD_PASSWORD"   # set env var to enable

# ------------------------------------------------------------------
# Deployment Manager  (main WebSphere management point)
# ------------------------------------------------------------------
deployment_manager:
  host: "dmgr.company.com"
  soap_port: 8879
  admin_http_port: 9060
  admin_https_port: 9043
  admin_username: "wsadmin"
  admin_password_env: "DMGR_PASSWORD"       # env var name
  cell_name: "MYCell01"
  was_home: "/opt/IBM/WebSphere/AppServer"
  profile_name: "Dmgr01"
  ssh_username: "wasadmin"
  ssh_key_env: "WAS_SSH_KEY_PATH"           # path to private key

# ------------------------------------------------------------------
# Sites (HA / DR)
# ------------------------------------------------------------------
sites:
  - id: "primary"
    name: "Primary Site"
    location: "DC1 – New York"
    is_primary: true
    color: "#1e40af"

  - id: "dr"
    name: "DR Site"
    location: "DC2 – Chicago"
    is_primary: false
    color: "#7c3aed"

# ------------------------------------------------------------------
# WebSphere Application Server Clusters
# ------------------------------------------------------------------
clusters:
  - id: "app_cluster_primary"
    name: "Application Cluster"
    site_id: "primary"
    was_home: "/opt/IBM/WebSphere/AppServer"
    profile_name: "AppSrv01"
    ssh_username: "wasadmin"
    ssh_key_env: "WAS_SSH_KEY_PATH"
    admin_username: "wsadmin"
    admin_password_env: "DMGR_PASSWORD"
    members:
      - id: "was_app_p1"
        server_name: "AppServer1"
        node_name: "AppNode01"
        host: "was-app1.company.com"
        http_port: 9080
        https_port: 9443

      - id: "was_app_p2"
        server_name: "AppServer2"
        node_name: "AppNode02"
        host: "was-app2.company.com"
        http_port: 9080
        https_port: 9443

  - id: "app_cluster_dr"
    name: "Application Cluster (DR)"
    site_id: "dr"
    was_home: "/opt/IBM/WebSphere/AppServer"
    profile_name: "AppSrv01"
    ssh_username: "wasadmin"
    ssh_key_env: "WAS_SSH_KEY_PATH"
    admin_username: "wsadmin"
    admin_password_env: "DMGR_PASSWORD"
    members:
      - id: "was_app_dr1"
        server_name: "AppServer1"
        node_name: "DRAppNode01"
        host: "dr-was-app1.company.com"
        http_port: 9080
        https_port: 9443

# ------------------------------------------------------------------
# On-Demand Routers (ODR / Proxy Layer)
# ------------------------------------------------------------------
odr_servers:
  - id: "odr_p1"
    name: "ODR Primary 1"
    site_id: "primary"
    server_name: "ODRServer01"
    node_name: "ODRNode01"
    host: "odr1.company.com"
    http_port: 9080
    https_port: 9443
    was_home: "/opt/IBM/WebSphere/AppServer"
    profile_name: "AppSrv01"
    ssh_username: "wasadmin"
    ssh_key_env: "WAS_SSH_KEY_PATH"
    admin_username: "wsadmin"
    admin_password_env: "DMGR_PASSWORD"

  - id: "odr_p2"
    name: "ODR Primary 2"
    site_id: "primary"
    server_name: "ODRServer02"
    node_name: "ODRNode02"
    host: "odr2.company.com"
    http_port: 9080
    https_port: 9443
    was_home: "/opt/IBM/WebSphere/AppServer"
    profile_name: "AppSrv01"
    ssh_username: "wasadmin"
    ssh_key_env: "WAS_SSH_KEY_PATH"
    admin_username: "wsadmin"
    admin_password_env: "DMGR_PASSWORD"

  - id: "odr_dr1"
    name: "ODR DR 1"
    site_id: "dr"
    server_name: "DRODRServer01"
    node_name: "DRODRNode01"
    host: "dr-odr1.company.com"
    http_port: 9080
    https_port: 9443
    was_home: "/opt/IBM/WebSphere/AppServer"
    profile_name: "AppSrv01"
    ssh_username: "wasadmin"
    ssh_key_env: "WAS_SSH_KEY_PATH"
    admin_username: "wsadmin"
    admin_password_env: "DMGR_PASSWORD"

# ------------------------------------------------------------------
# IIS Web Servers  (front-end layer)
# ------------------------------------------------------------------
iis_servers:
  - id: "iis_p1"
    name: "IIS Primary 1"
    site_id: "primary"
    host: "iis1.company.com"
    winrm_port: 5985
    winrm_use_ssl: false
    winrm_username: "DOMAIN\\iisadmin"
    winrm_password_env: "IIS1_PASSWORD"
    iis_sites:
      - name: "Default Web Site"
        app_pools:
          - "DefaultAppPool"
          - "WebSphereProxy"

  - id: "iis_p2"
    name: "IIS Primary 2"
    site_id: "primary"
    host: "iis2.company.com"
    winrm_port: 5985
    winrm_use_ssl: false
    winrm_username: "DOMAIN\\iisadmin"
    winrm_password_env: "IIS2_PASSWORD"
    iis_sites:
      - name: "Default Web Site"
        app_pools:
          - "DefaultAppPool"

  - id: "iis_dr1"
    name: "IIS DR 1"
    site_id: "dr"
    host: "dr-iis1.company.com"
    winrm_port: 5985
    winrm_use_ssl: false
    winrm_username: "DOMAIN\\iisadmin"
    winrm_password_env: "IIS_DR_PASSWORD"
    iis_sites:
      - name: "Default Web Site"
        app_pools:
          - "DefaultAppPool"

