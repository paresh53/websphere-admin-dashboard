# ============================================================
#  WebSphere Admin Dashboard - Environment Configuration
#  Edit ONLY this file to configure your environment.
#  NEVER put passwords here – use environment variables instead.
# ============================================================

app:
  name: "WebSphere Admin Dashboard"
  title: "IBM Middleware Administration"
  refresh_interval: 30          # Auto-refresh every N seconds
  backend_port: 8000             # FastAPI backend port
  simulation_mode: true          # true = return fake data (no real SSH/WinRM)

  # Optional basic-auth for the dashboard
  auth_enabled: false
  auth_username: "admin"
  auth_password_env: "DASHBOARD_PASSWORD"   # set env var to enable

# ------------------------------------------------------------------
# Deployment Manager  (main WebSphere management point)
# ------------------------------------------------------------------
deployment_manager:
  host: "dmgr01.company.com"
  soap_port: 8879
  admin_http_port: 9060
  admin_https_port: 9043
  admin_username: "wsadmin"
  admin_password_env: "DMGR_PASSWORD"
  cell_name: "MYCell01"
  was_home: "/opt/IBM/WebSphere/AppServer"
  profile_name: "Dmgr01"
  ssh_username: "wasadmin"
  ssh_key_env: "WAS_SSH_KEY_PATH"

# ------------------------------------------------------------------
# Sites (HA / DR)
# ------------------------------------------------------------------
sites:
  - id: "primary"
    name: "Primary Site"
    location: "DC1 – New York"
    is_primary: true
    color: "#1e40af"

  - id: "dr"
    name: "DR Site"
    location: "DC2 – Chicago"
    is_primary: false
    color: "#7c3aed"

# ------------------------------------------------------------------
# WebSphere Application Server Clusters
# ------------------------------------------------------------------
clusters:
  # ── Primary: 4-member cluster ──────────────────────────────────
  - id: "app_cluster_primary"
    name: "AppCluster01"
    site_id: "primary"
    was_home: "/opt/IBM/WebSphere/AppServer"
    profile_name: "AppSrv01"
    ssh_username: "wasadmin"
    ssh_key_env: "WAS_SSH_KEY_PATH"
    admin_username: "wsadmin"
    admin_password_env: "DMGR_PASSWORD"
    members:
      - id: "was_p01"
        name: "WAS-P01"
        server_name: "AppServer01"
        node_name: "AppNode01"
        host: "was-p01.company.com"
        http_port: 9080
        https_port: 9443

      - id: "was_p02"
        name: "WAS-P02"
        server_name: "AppServer02"
        node_name: "AppNode02"
        host: "was-p02.company.com"
        http_port: 9080
        https_port: 9443

      - id: "was_p03"
        name: "WAS-P03"
        server_name: "AppServer03"
        node_name: "AppNode03"
        host: "was-p03.company.com"
        http_port: 9080
        https_port: 9443

      - id: "was_p04"
        name: "WAS-P04"
        server_name: "AppServer04"
        node_name: "AppNode04"
        host: "was-p04.company.com"
        http_port: 9080
        https_port: 9443

  # ── DR: 2-member cluster (standby) ─────────────────────────────
  - id: "app_cluster_dr"
    name: "AppCluster01-DR"
    site_id: "dr"
    was_home: "/opt/IBM/WebSphere/AppServer"
    profile_name: "AppSrv01"
    ssh_username: "wasadmin"
    ssh_key_env: "WAS_SSH_KEY_PATH"
    admin_username: "wsadmin"
    admin_password_env: "DMGR_PASSWORD"
    members:
      - id: "was_dr01"
        name: "WAS-DR01"
        server_name: "AppServer01"
        node_name: "DRNode01"
        host: "was-dr01.company.com"
        http_port: 9080
        https_port: 9443

      - id: "was_dr02"
        name: "WAS-DR02"
        server_name: "AppServer02"
        node_name: "DRNode02"
        host: "was-dr02.company.com"
        http_port: 9080
        https_port: 9443

