# ------------------------------------------------------------------
# IIS Web Servers  (front-end layer)
# ------------------------------------------------------------------
iis_servers:
  - id: "iis_p01"
    name: "IIS-P01"
    site_id: "primary"
    host: "iis-p01.company.com"
    winrm_port: 5985
    winrm_use_ssl: false
    winrm_username: "DOMAIN\\iisadmin"
    winrm_password_env: "IIS_P01_PASSWORD"
    iis_sites:
      - name: "Default Web Site"
        app_pools: ["DefaultAppPool", "WASProxyPool"]

  - id: "iis_p02"
    name: "IIS-P02"
    site_id: "primary"
    host: "iis-p02.company.com"
    winrm_port: 5985
    winrm_use_ssl: false
    winrm_username: "DOMAIN\\iisadmin"
    winrm_password_env: "IIS_P02_PASSWORD"
    iis_sites:
      - name: "Default Web Site"
        app_pools: ["DefaultAppPool", "WASProxyPool"]

  - id: "iis_dr01"
    name: "IIS-DR01"
    site_id: "dr"
    host: "iis-dr01.company.com"
    winrm_port: 5985
    winrm_use_ssl: false
    winrm_username: "DOMAIN\\iisadmin"
    winrm_password_env: "IIS_DR_PASSWORD"
    iis_sites:
      - name: "Default Web Site"
        app_pools: ["DefaultAppPool"]

