app:
  name: WebSphere Admin Dashboard
  title: IBM Middleware Administration
  refresh_interval: 30
  backend_port: 8000
  simulation_mode: true
  auth_enabled: false
  auth_username: admin
  auth_password_env: DASHBOARD_PASSWORD
deployment_manager:
  host: dmgr01.company.com
  soap_port: 8879
  admin_http_port: 9060
  admin_https_port: 9043
  admin_username: wsadmin
  admin_password_env: DMGR_PASSWORD
  cell_name: MYCell01
  was_home: /opt/IBM/WebSphere/AppServer
  profile_name: Dmgr01
  ssh_username: wasadmin
  ssh_key_env: WAS_SSH_KEY_PATH
sites:
- id: primary
  name: Primary Site
  location: DC1 – New York
  is_primary: true
  color: '#1e40af'
- id: dr
  name: DR Site
  location: DC2 – Chicago
  is_primary: false
  color: '#7c3aed'
